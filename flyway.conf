# Configuração do Flyway para o DevPortfolio
# Banco de dados: MySQL 8.
#
# A URL aponta para o servidor local, sem banco padrão: o Flyway cria o banco
# definido em flyway.schemas (devportfolio) se ele ainda não existir.
# Para outro ambiente, sobrescrever com a variável de ambiente FLYWAY_URL.
#
# Credenciais NÃO devem ser versionadas. O Flyway lê automaticamente as
# variáveis de ambiente FLYWAY_USER e FLYWAY_PASSWORD.

flyway.url=jdbc:mysql://localhost:3306?allowPublicKeyRetrieval=true&useSSL=false
flyway.schemas=devportfolio
flyway.createSchemas=true
flyway.locations=filesystem:migrations
flyway.baselineOnMigrate=false
flyway.validateMigrationNaming=true
flyway.encoding=UTF-8
